# Standalone instance. Start with the repository directory as nginx's -p prefix.
worker_processes 1;
# Bound graceful shutdown of long-lived SSE streams below PM2's kill_timeout.
worker_shutdown_timeout 3s;
pid .runtime/frontend-preview/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path .runtime/frontend-preview/body;
    proxy_temp_path .runtime/frontend-preview/proxy;

    # cloudflared connects over loopback; retain the public HTTPS scheme/client IP.
    map $http_x_forwarded_proto $frontend_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 127.0.0.1:5080;
        server_name crm.yumnetwork.vn localhost 127.0.0.1;
        set_real_ip_from 127.0.0.1;
        real_ip_header CF-Connecting-IP;
        root frontend-dist;
        index index.html;
        client_max_body_size 25m;

        # Browser requests stay on the preview origin, including session cookies.
        # Preserve bodies/signatures and stream SSE without response buffering.
        location ~ ^/(api|uploads|webhooks?)(/|$) {
            proxy_pass http://127.0.0.1:5002;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $frontend_forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
        }

        location ~ /\. {
            return 404;
        }

        # Missing JS/CSS must return 404 rather than the SPA HTML document.
        location /assets/ {
            try_files $uri @previous_frontend_assets;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Keep lazy-loaded bundles available for tabs opened before the cutover.
        location @previous_frontend_assets {
            root frontend-previous;
            try_files $uri @legacy_frontend_assets;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location @legacy_frontend_assets {
            root dist;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
            add_header X-CRM-Frontend "standalone";
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        }
    }
}
